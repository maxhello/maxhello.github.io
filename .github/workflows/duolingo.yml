name: Daily Duolingo snapshot

# 每天两次(北京时间),同日重跑覆盖、每天只留一条快照。
# 注意 xpGains 对当天数据有数小时滞后:21:13 收尾那次可能缺傍晚后的课,
# 且 21:13 之后学的课当天抓不到——都由次日 09:13 那次自动回填。
on:
  schedule:
    - cron: '13 1 * * *' # 北京 09:13 早:回填昨晚深夜/滞后缺的课
    - cron: '13 13 * * *' # 北京 21:13 晚:当天收尾快照
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

concurrency:
  group: duolingo-snapshot

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Duolingo snapshot
        run: python3 scripts/fetch-duolingo.py
        env:
          # 漏了这三行,CI 会静默退化为纯公开模式(无日明细),2026-08-17 排查发现从一开始就漏了
          DUOLINGO_JWT: ${{ secrets.DUOLINGO_JWT }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/duolingo-history.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: duolingo snapshot $(date -u +%F)"
            git push
          fi
