name: Daily Duolingo snapshot

# 每天四次(北京时间),同日重跑覆盖、每天只留一条快照。
# 注意 xpGains 对当天数据有数小时滞后:白天几次可能缺当天明细,23:53 收尾那次最准;
# 深夜 23:53 之后学的课,由次日 09:13 那次自动回填。
on:
  schedule:
    - cron: '13 1 * * *' # 北京 09:13 早:回填昨晚深夜的课
    - cron: '23 5 * * *' # 北京 13:23 午:上午的课(可能不全)
    - cron: '13 13 * * *' # 北京 21:13 晚:下午的课
    - cron: '53 15 * * *' # 北京 23:53 深夜:当天权威快照
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

concurrency:
  group: duolingo-snapshot

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Duolingo snapshot
        run: python3 scripts/fetch-duolingo.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/duolingo-history.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: duolingo snapshot $(date -u +%F)"
            git push
          fi
