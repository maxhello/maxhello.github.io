name: Daily Duolingo snapshot

on:
  schedule:
    - cron: '53 15 * * *' # 每天 UTC 15:53(北京时间 23:53),当天学习收尾后抓取
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

concurrency:
  group: duolingo-snapshot

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Duolingo snapshot
        run: python3 scripts/fetch-duolingo.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/duolingo-history.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: duolingo snapshot $(date -u +%F)"
            git push
          fi
