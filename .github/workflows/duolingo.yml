name: Daily Duolingo snapshot

# 每天两次(北京时间),同日重跑覆盖、每天只留一条快照。
# GitHub 定时实测漂移 3~5 小时(2026-08~09 观察:13:13Z 的班次实际 16~18Z 才跑)。
# 脚本把凌晨 5 点前跑的采集归前一天,所以晚班定在 23:13、漂到凌晨 2~4 点反而是最理想的收尾;
# 早班漂到中午前后,负责回填昨晚滞后进 xpGains 的课。升分/单元完成日由逐课时间戳反推,不受漂移影响。
on:
  schedule:
    - cron: '13 1 * * *' # 北京 09:13 早(实跑约 12~14 点):回填昨晚深夜/滞后缺的课
    - cron: '13 15 * * *' # 北京 23:13 晚(实跑约次日 2~4 点,归前一天):当天收尾快照
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

concurrency:
  group: duolingo-snapshot

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch Duolingo snapshot
        run: python3 scripts/fetch-duolingo.py
        env:
          # 漏了这三行,CI 会静默退化为纯公开模式(无日明细),2026-08-17 排查发现从一开始就漏了
          DUOLINGO_JWT: ${{ secrets.DUOLINGO_JWT }}

      # Praktika(口语)搭同一个 workflow:部署靠 deploy.yml 监听本 workflow 名触发,另起一个就要再配一遍。
      # 失败不拦多邻国快照的提交(continue-on-error),但最后一步会把整个 run 标红。
      # Secret 没配 = 停用 Praktika 采集:脚本只打警告、正常退出。
      - name: Fetch Praktika sessions
        id: praktika
        continue-on-error: true
        run: python3 scripts/fetch-praktika.py
        env:
          PRAKTIKA_REFRESH_TOKEN: ${{ secrets.PRAKTIKA_REFRESH_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/duolingo-history.json
          if [ -f data/praktika-history.json ]; then git add data/praktika-history.json; fi
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: duolingo snapshot $(date -u +%F)"
            git push
          fi

      - name: Fail if Praktika fetch failed
        if: steps.praktika.outcome == 'failure'
        run: |
          echo "::error::Praktika fetch failed (refresh token revoked or API changed); Duolingo snapshot was still committed"
          exit 1
