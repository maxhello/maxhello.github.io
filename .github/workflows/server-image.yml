# 陪练后端镜像:push 触碰 tutor/server/** 时构建并推 GHCR,服务器上 rollout restart 即更新。
# 镜像包 tutor-api 原属 livekit-tutor 仓库(2026-11-15 并入本仓库),
# 需在 GHCR 包设置的 Manage Actions access 里给本仓库 Write 权限,否则推送 403。
name: server-image

on:
  push:
    branches: [main]
    paths: ["tutor/server/**", ".github/workflows/server-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3 # 交叉构建 arm64(服务器是 Oracle ARM)

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./tutor/server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tutor-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
