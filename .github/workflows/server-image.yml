# 后端镜像(site-api/):push 触碰 site-api/** 时构建并推 GHCR,服务器上 rollout restart 即更新。
# 包名 site-api(2026-11-15 并入本仓库时新建:后端既管陪练也管站点学习数据;旧包 tutor-api 属于已停用的 livekit-tutor 仓库)。
# 包可见性须为 Public(k3s 不带 imagePullSecret)。
name: server-image

on:
  push:
    branches: [main]
    paths: ["site-api/**", ".github/workflows/server-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3 # 交叉构建 arm64(服务器是 Oracle ARM)

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./site-api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/site-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
