name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # snapshot workflow 用 GITHUB_TOKEN 推送,GitHub 防循环规则使它不触发 on:push;
  # workflow_run 是官方提供的例外:GITHUB_TOKEN 的推送也能触发它。
  # 不加这个,每日数据 commit 后网站永远不会重建。
  workflow_run:
    workflows: ['Daily Duolingo snapshot']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # workflow_run 无论成功失败都会触发,只在 snapshot 成功时部署
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # SPA 路由需要 404 兜底,否则刷新 /blog 等路径会 404
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
