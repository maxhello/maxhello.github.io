name: keepalive

# 定时访问 Variables 里的地址,防止免费 PaaS(Render 等)实例闲置休眠
# 分钟取 7/20/33/46/59 错开整点高负载,最大间隔 13 分钟 < 15 分钟休眠阈值
# 加新地址:Settings → Secrets and variables → Actions → Variables → PING_URLS(逗号分隔),不用改代码
# 用 vars 不用 secrets:URL 不敏感,Variables 里值可随时查看修改(secrets 存了就看不见)

on:
  schedule:
    - cron: '7-59/13 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping all URLs
        env:
          URLS: ${{ vars.PING_URLS }}
        run: |
          # 变量空 = 配置丢了,变红报警,不能绿灯空转让 PaaS 悄悄休眠
          [[ -z "$URLS" ]] && { echo "PING_URLS 未配置(仓库 Variables 里没有这个变量)"; exit 1; }
          IFS=',' read -ra arr <<< "$URLS"
          for u in "${arr[@]}"; do
            u=$(echo "$u" | xargs)
            echo "ping $u"
            curl -sS -m 90 -o /dev/null -w "$u → HTTP %{http_code} (%{time_total}s)\n" "$u" || true
          done
